<main class="w-full max-w-4xl flex flex-col items-center space-y-3 md:space-y-6">

<!-- Difficulty Selection -->
<section class="flex flex-col items-center gap-2 md:gap-3">
<h2 class="text-base sm:text-lg md:text-xl font-semibold text-white">Choose Difficulty</h2>
<div class="difficulty-buttons flex flex-wrap justify-center gap-2 md:gap-4">
<button class="px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg bg-red-500 hover:bg-red-600 transition-colors text-sm sm:text-base" id="e">Easy</button>
<button class="px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg bg-yellow-500 hover:bg-yellow-600 transition-colors text-sm sm:text-base" id="m">Medium</button>
<button class="px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg bg-green-500 hover:bg-green-600 transition-colors text-sm sm:text-base" id="h">Hard</button>
</div>
</section>

<section class="w-full container disabled opacity-40 pointer-events-none transition-all duration-500 mt-4 md:mt-6">
<div class="lives-text text-sm sm:text-base md:text-lg mb-3 md:mb-4 text-center text-white" id="lives-display">

<!-- Cards will be injected here -->
</div>
</section>
