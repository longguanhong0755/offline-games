<body class="bg-bg text-fg min-h-dvh">
<div class="mx-auto w-full max-w-[440px] p-3" id="app">
<!-- トップバー -->
<header class="flex items-center justify-between">
<div class="text-center leading-tight">
<div class="text-muted text-xs">HIGH SCORE</div>
<div class="num font-semibold" id="highScore">0</div>
</div>
<div class="text-center">
<div class="text-muted text-xs tracking-wide uppercase">score</div>
<div class="num text-2xl font-bold" id="score">0</div>
</div>
<button class="btn-control bg-panel border-border rounded-xl border px-3 py-2" id="pauseBtn">▶</button>
</header>
<!-- メインエリア -->
<main class="mt-3 grid grid-cols-[64px_minmax(0,1fr)_88px] gap-2">
<!-- 左: Level -->
<aside class="bg-panel border-border flex flex-col items-center gap-3 rounded-xl border p-2">
<div class="text-muted text-xs">Level</div>
<div class="text-xl font-semibold" id="level">1</div>
<!-- Level stack -->
<div aria-label="Level 1 / 20" class="level-stack" id="levelStack" role="img">
<div class="level-stack__fill" id="levelStackFill" style="height: 5%;"></div>
</div>
<!-- Level gauge -->
<div class="level-gauge-wrap">
<div aria-hidden="true" class="level-gauge__label" id="levelGaugeLabel">0/10</div>
<div aria-valuemax="100" aria-valuemin="0" aria-valuenow="0" aria-valuetext="0/10" class="level-gauge" id="levelGauge" role="progressbar" title="0/10">
<div class="level-gauge__fill" id="levelGaugeFill" style="height: 0%;"></div>
</div>
</div>
</aside>
<!-- 中央: ボード -->
<section class="bg-surface border-border relative flex aspect-1/2 items-stretch justify-stretch overflow-hidden rounded-xl border" id="boardWrap">
<canvas class="block h-full w-full" height="494" id="board" width="246"></canvas>
</section>
<!-- 右: NEXT -->
<aside class="bg-panel border-border rounded-xl border p-2">
<div class="text-muted text-xs">NEXT</div>
<div class="mt-2 grid gap-2">
<canvas class="bg-surface border-border aspect-square w-full rounded-lg border" height="70" id="next0" style="width: 70px; height: 70px;" width="70"></canvas>
<canvas class="bg-surface border-border aspect-square w-full rounded-lg border" height="70" id="next1" style="width: 70px; height: 70px;" width="70"></canvas>
<canvas class="bg-surface border-border aspect-square w-full rounded-lg border" height="70" id="next2" style="width: 70px; height: 70px;" width="70"></canvas>
</div>
</aside>
</main>
<!-- 操作ボタン -->
<footer class="mt-3 flex justify-between">
<div class="flex flex-col gap-2">
<button class="btn-control bg-panel border-border h-14 w-14 rounded-2xl border" id="btn-rot">
            ⟳
          </button>
<button class="btn-control bg-panel border-border h-14 w-14 rounded-2xl border" id="btn-left">
            ←
          </button>
</div>
<div class="flex flex-col gap-2">
<button class="btn-control bg-panel border-border h-14 w-14 rounded-2xl border" id="btn-down">
            ↓
          </button>
<button class="btn-control bg-panel border-border h-14 w-14 rounded-2xl border" id="btn-right">
            →
          </button>
</div>
</footer>
</div>
</body></html>
