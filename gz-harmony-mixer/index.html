<body>

<h1>Harmony Mixer</h1>

<div class="controls">
<label for="pitch">Pitch: </label>
<input id="pitch" max="2" min="0.5" step="0.01" type="range" value="1"/>

</div>
<canvas id="visualizer"></canvas>
<div id="seek-container">
<label for="seek-bar">Seek: </label>
<input id="seek-bar" max="100" min="0" step="0.1" type="range" value="0"/>
<button id="play"><img alt="" src="/_assets/d3f2c1cb6e207eb596cb.png" width="80%"/></button>
