            background: #000;
        }

        #app {
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
        }

        #hud {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Courier New', monospace;
            font-size: 24px;
            color: #fff;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            z-index: 10;
        }

        #overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 18, 0.85);
            z-index: 20;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        #overlay.hidden {
            display: none;
        }

        #overlay h1 {
            font-family: 'Courier New', monospace;
            font-size: 48px;
            color: #ff6688;
            margin-bottom: 16px;
        }

        #overlay p {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            color: #aaa;
        }

        #glitch {
            position: fixed;
            inset: 0;
            background: rgba(120, 0, 200, 0.1);
            mix-blend-mode: overlay;
            pointer-events: none;
            opacity: 0;
            z-index: 15;
            transition: opacity 0.05s;
        }

        /* ── Touch controls ── */
        #touch-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            padding: 16px 12px;
            z-index: 18;
            pointer-events: none;
        }

        #touch-controls button {
            pointer-events: auto;
            width: 72px;
            height: 72px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            font-size: 28px;
            font-family: 'Courier New', monospace;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            backdrop-filter: blur(4px);
        }

        #touch-controls button:active {
            background: rgba(255, 255, 255, 0.35);
        }

        .touch-lr {
            display: flex;
            gap: 12px;
        }

        @media (pointer: coarse) {
            #touch-controls {
                display: flex;
            }
        }
