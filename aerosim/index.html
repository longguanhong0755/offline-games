function show_infobox() {
    infobox.style.display = "block";

    // Measure box
    const w = infobox.offsetWidth;
    const h = infobox.offsetHeight;

    // Center in viewport
    const left = (window.innerWidth - w) / 2;
    const top = (window.innerHeight - h) / 2;

    infobox.style.left = left + "px";
    infobox.style.top = top + "px";
}

</script>

    function custom_prerun(){

        console.log(__FILE__, "custom_prerun")

    }

    function custom_postrun(){
        // python main and no VFS filesystem yet.
        console.log(__FILE__, "custom_postrun")

    }

    function debug() {
        // allow to gain access to dev tools from js console
        // but only on desktop. difficult to reach when in iframe
        python.config.debug = true
        custom_onload(false)
        Module.PyRun_SimpleString("shell.uptime()")
        window_resize()
    }

    function info_inline(data){
        document.getElementById("info").innerHTML = data
    }

    function info_online(url) {
        // display info about current APK
        fetch( url /*, options */)
            .then((response) => response.text())
            .then((html) => {
                info_inline(html);
        })
        .catch((error) => {
            console.warn(error);
        });
    }

    function frame_online(url) {
        window.frames["iframe"].location = url;
    }

    function exit_app() {
        try {
            window.open('', '_self', '');
            window.close();
        } catch (e) {}
        setTimeout(function() {
            window.location.href = "https://github.com/AshDashes/aerosim";
        }, 150);
    }

    window.live_densities = {
        'CYYZ': 1.208,
        'KORD': 1.205,
        'EGLL': 1.259
    };

    async function fetchLiveAirDensities() {
        const coords = {
            'CYYZ': [43.6777, -79.6248],
            'KORD': [41.9742, -87.9073],
            'EGLL': [51.4700, -0.4543]
        };
        for (const [icao, [lat, lon]] of Object.entries(coords)) {
            try {
                const res = await fetch(`/_assets/6d99984d18d6dac07332.json?latitude=${lat}&longitude=${lon}&current=temperature_2m,surface_pressure`);
                const data = await res.json();
                const tempC = data.current.temperature_2m;
                const pressPa = data.current.surface_pressure * 100.0;
                const tempK = tempC + 273.15;
                const rho = pressPa / (287.05 * tempK);
                window.live_densities[icao] = rho;
                console.log("Updated live density for " + icao + ": " + rho.toFixed(4));
            } catch(e) {}
        }
    }
    fetchLiveAirDensities();

    </script>
