<div class="container-fluid">
<div class="row text-center">
<div class="col-xs-3 text-center" style="padding-top: 30px">
<div id="diffchoose">
<label class="container">Easy
                        <input class="dif" name="radio" type="radio" value="0"/>
<span class="checkmark"></span>
</label>
<label class="container">Medium
                        <input checked="checked" class="dif" name="radio" type="radio" value="1"/>

                        <input class="dif" name="radio" type="radio" value="3"/>

</label>
</div>
</div>
<div class="col-xs-6" style="right: 65px; font-family: Acme!important;">
<h2>
                    I'm thinking of a number between
                </h2>
<h1>1 and <span id="max">100</span></h1>
<h3>
                    You have ten guesses<br/>
                    Can you figure out what it is?
                </h3>
</div>
<div class="col-xs-3 hbox">
<h2>Show Hints</h2>
<label class="switch">
<input checked="" type="checkbox"/>
<span class="slider round"></span>
</label>
</div>
</div>
<div class="text-center" style="margin-left: -120px">
<a class="btn btn-warning" id="resetbtn">Reset</a>
</div>
<div class="center-block">
<div class="row">
<div class="blocks col-xs-3 text-center" id="guesspanel">

</div>
</div>

<input class="form-control center-block" id="gno" min="1" oninput="validity.valid||(value='');" placeholder="Type Your Guess Here!" step="1" type="number"/>
<a class="btn btn-danger text-uppercase" id="gbtn">Guess</a>
</div>
<div class="blocks col-xs-4" id="hintpanel" style="width: 30%">
<h2 class="text-center">Hints</h2><br/><br/>
<div class="hcontent center-block text-center">
</div>
<h1 class="text-center" id="tsfd" style="color: blue; display: none;">Too smart for hints</h1>
</div>
</div>
</div>
