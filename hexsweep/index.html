<style>

    body {

    }

    .chip, button.chip {
      border: 1px solid rgba(20,32,26,0.12); background: #fff; border-radius: 999px;
      padding: 0.45rem 0.8rem; font-size: 0.82rem; color: var(--muted); cursor: pointer;
    }
    button.chip.active { border-color: var(--accent); color: var(--accent); background: #e7f3ed; }
    .chip b { color: var(--ink); }
    button.primary {
      border: 0; background: var(--accent); color: #fff; font-family: var(--display);
      font-weight: 700; border-radius: 10px; padding: 0.65rem 1rem; cursor: pointer;
    }

      border-radius: 16px; padding: 1rem; overflow: auto;

    svg { display: block; margin: 0 auto; max-width: 100%; height: auto; user-select: none; }
    .hex { cursor: pointer; transition: transform 0.12s; }
    .hex:hover { filter: brightness(0.97); }
    .msg {
      margin-top: 0.85rem; min-height: 1.4rem; font-family: var(--display);
      font-size: 1rem; color: var(--accent); text-align: center;
    }
    .help { margin-top: 0.5rem; font-size: 0.82rem; color: var(--muted); text-align: center; line-height: 1.5; }
    footer { margin-top: 1rem; display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); }
    a { color: var(--accent); }

</div>
<div class="msg" id="msg"></div>
<p class="help">Left click / tap: reveal · Right click / long-press: flag<br/>Middle click or both buttons (chord): open neighbors when flags match<br/>Clear every safe hex. Numbers count adjacent mines (6 neighbors).</p>
<footer>
<span>Original game by Kian Zarandi</span>
<a>GitHub</a>
</footer>
</div>
<script>
    const PRESETS = {
      easy:   { radius: 3, mineRatio: 0.12, size: 28, cx: 260, cy: 230, vb: "0 0 520 460" },
      normal: { radius: 5, mineRatio: 0.18, size: 22, cx: 260, cy: 230, vb: "0 0 520 460" },
      hard:   { radius: 7, mineRatio: 0.22, size: 16, cx: 260, cy: 230, vb: "0 0 520 460" },
    };
    const BEST_KEY = "hexsweep-best-times";
    const svg = document.getElementById("svg");
    const dirs = [[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];

    let difficulty = "normal";
    let SIZE = 22, CX = 260, CY = 230;
    let cells, mineCount, flags, startedAt, timer, ended, pressTimer;

    function key(q, r) { return q + "," + r; }

    function loadBests() {
      try { return JSON.parse(localStorage.getItem(BEST_KEY) || "{}"); }
      catch { return {}; }
    }

    function bestFor(diff) {
      const t = loadBests()[diff];
      return typeof t === "number" ? t : null;
    }

    function saveBest(diff, seconds) {
      const all = loadBests();
      if (all[diff] == null || seconds < all[diff]) {
        all[diff] = seconds;
        localStorage.setItem(BEST_KEY, JSON.stringify(all));
      }
    }

    function axialToPixel(q, r) {
      const x = SIZE * (Math.sqrt(3) * q + Math.sqrt(3) / 2 * r);
      const y = SIZE * (3 / 2 * r);
      return { x: x + CX, y: y + CY };
    }

    function hexPath(x, y, s = SIZE - 1.5) {
      const pts = [];
      for (let i = 0; i < 6; i++) {
        const a = Math.PI / 180 * (60 * i - 30);
        pts.push([x + s * Math.cos(a), y + s * Math.sin(a)]);
      }
      return pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ") + "Z";
    }

    function neighbors(q, r) {
      return dirs.map(([dq, dr]) => key(q + dq, r + dr)).filter((k) => cells.has(k));
    }

    function build() {
      const preset = PRESETS[difficulty];
      SIZE = preset.size; CX = preset.cx; CY = preset.cy;
      svg.setAttribute("viewBox", preset.vb);
      clearInterval(timer); ended = false; flags = 0; startedAt = null;
      document.getElementById("msg").textContent = "";
      cells = new Map();
      const RADIUS = preset.radius;
      for (let q = -RADIUS; q <= RADIUS; q++) {
        for (let r = -RADIUS; r <= RADIUS; r++) {
          if (Math.max(Math.abs(q), Math.abs(r), Math.abs(-q - r)) <= RADIUS) {
            cells.set(key(q, r), { q, r, mine: false, open: false, flag: false, n: 0 });
          }
        }
      }
      const keys = [...cells.keys()];
      mineCount = Math.max(1, Math.floor(keys.length * preset.mineRatio));
      const picks = new Set();
      while (picks.size < mineCount) picks.add(keys[Math.floor(Math.random() * keys.length)]);
      for (const k of picks) cells.get(k).mine = true;
      for (const c of cells.values()) {
        c.n = neighbors(c.q, c.r).reduce((a, k) => a + (cells.get(k).mine ? 1 : 0), 0);
      }
      render(); hud();
    }

    function hud() {
      document.getElementById("mines").textContent = mineCount;
      document.getElementById("flags").textContent = flags;
      document.getElementById("time").textContent = startedAt ? Math.floor((Date.now() - startedAt) / 1000) : 0;
      const b = bestFor(difficulty);
      document.getElementById("best").textContent = b == null ? "—" : b + "s";
    }

    function ensureTimer() {
      if (startedAt) return;
      startedAt = Date.now();
      timer = setInterval(hud, 250);
    }

    function openCell(k) {
      const c = cells.get(k);
      if (!c || c.open || c.flag || ended) return;
      ensureTimer();
      c.open = true;
      if (c.mine) {
        ended = true; clearInterval(timer); revealMines();
        document.getElementById("msg").textContent = "Boom — try again";
        render(); return;
      }
      if (c.n === 0) neighbors(c.q, c.r).forEach(openCell);
      checkWin();
      render(); hud();
    }

    function checkWin() {
      if (![...cells.values()].every((x) => x.mine || x.open)) return;
      ended = true; clearInterval(timer);
      const secs = Math.floor((Date.now() - startedAt) / 1000);
      saveBest(difficulty, secs);
      const b = bestFor(difficulty);
      document.getElementById("msg").textContent = `Cleared in ${secs}s · best ${b}s (${difficulty})`;
      hud();
    }

    function toggleFlag(k) {
      const c = cells.get(k);
      if (!c || c.open || ended) return;
      ensureTimer();
      c.flag = !c.flag; flags += c.flag ? 1 : -1; render(); hud();
    }

    /** Chord / middle-click: if open cell's flag count matches n, open unmarked neighbors. */
    function chord(k) {
      const c = cells.get(k);
      if (!c || !c.open || c.n === 0 || ended) return;
      const nbs = neighbors(c.q, c.r);
      const flagCount = nbs.reduce((a, nk) => a + (cells.get(nk).flag ? 1 : 0), 0);
      if (flagCount !== c.n) return;
      ensureTimer();
      for (const nk of nbs) {
        const nb = cells.get(nk);
        if (!nb.flag && !nb.open) openCell(nk);
      }
    }

    function revealMines() {
      for (const c of cells.values()) if (c.mine) c.open = true;
    }

    function render() {
      const nums = ["","#0f7a55","#2563eb","#b45309","#b91c1c","#7c3aed","#0e7490"];
      let html = "";
      for (const c of cells.values()) {
        const { x, y } = axialToPixel(c.q, c.r);
        const fill = !c.open ? "#ffffff" : c.mine ? "#f8d4d0" : "#e7f3ed";
        const stroke = c.flag ? "#d97706" : "rgba(20,32,26,0.14)";
        html += `<g class="hex" data-k="${key(c.q,c.r)}">`;
        html += `<path d="${hexPath(x,y)}" fill="${fill}" stroke="${stroke}" stroke-width="${c.flag ? 2.5 : 1.2}"/>`;
        if (c.open && c.mine) html += `<circle cx="${x}" cy="${y}" r="6" fill="#c4473a"/>`;
        else if (c.open && c.n > 0) html += `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="${Math.max(10, SIZE * 0.55)}" font-family="Space Grotesk,sans-serif" font-weight="700" fill="${nums[c.n]}">${c.n}</text>`;
        else if (c.flag && !c.open) html += `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="11">▲</text>`;
        html += `</g>`;
      }
      svg.innerHTML = html;
      svg.querySelectorAll(".hex").forEach((g) => {
        g.addEventListener("click", (e) => {
          e.preventDefault();
          if (e.detail > 1) return;
          if (e.button === 1 || (e.buttons === 3)) { chord(g.dataset.k); return; }
          openCell(g.dataset.k);
        });
        g.addEventListener("auxclick", (e) => {
          if (e.button === 1) { e.preventDefault(); chord(g.dataset.k); }
        });
        g.addEventListener("mousedown", (e) => {
          // Both buttons held (chord)
          if (e.buttons === 3) { e.preventDefault(); chord(g.dataset.k); }
        });
        g.addEventListener("dblclick", (e) => { e.preventDefault(); chord(g.dataset.k); });
        g.addEventListener("contextmenu", (e) => { e.preventDefault(); toggleFlag(g.dataset.k); });
        g.addEventListener("touchstart", (e) => {
          pressTimer = setTimeout(() => { toggleFlag(g.dataset.k); pressTimer = null; }, 420);
        }, { passive: true });
        g.addEventListener("touchend", (e) => {
          if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; openCell(g.dataset.k); }
        });
      });
    }

    document.querySelectorAll("[data-diff]").forEach((btn) => {
      btn.addEventListener("click", () => {
        difficulty = btn.dataset.diff;
        document.querySelectorAll("[data-diff]").forEach((b) => b.classList.toggle("active", b === btn));
        build();
      });
    });
    document.getElementById("new").onclick = build;
    build();
  </script>
