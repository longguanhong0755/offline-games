<body>
<header>
<a href="index.html"><h1>Ultimate Football Manager</h1></a>
</header>
<main>
<section class="section-box" id="landing-page">
<div id="buttonBox">
<button id="start-game" type="button">Start New Game</button>
<!-- <button type="button">Load Saved Game</button> -->
</div>
</section>
<section class="section-box hide" id="team-selection">
<div id="teamSel_container">
<h2>Select a team:</h2>
<select id="league-dropdown" name="leagues">
<option value="">--Leagues--</option>
<option value="epl">Premier League</option>
<option value="champ">Championship</option>
<option value="efl1">League 1</option>
<option value="efl2">League 2</option>
</select>
<select id="team-dropdown" name="teams">
<option value="">--Teams--</option>
</select>
<button id="teamBtn" type="button">Finish</button>
</div>
</section>
<section class="section-box hide" id="main-menu">
<div id="mainMenu_btns">
<h2>Team: <span id="team-name"></span></h2>
<button id="teamPageBtn" type="button">Team</button>
<button id="leaguePageBtn" type="button">League Table</button>
<button id="schedulePageBtn" type="button">Schedule</button>
<button id="nextGameBtn" type="button">Next Game</button>
</div>
</section>
<section class="hide" id="team-page">
<div class="tableButtonContainer">
<table id="teamTable">
<thead id="tableHeader">
<tr>
<th>Name</th>
<th>Selection</th>
<th>Pos</th>
<th>Rating</th>
<th>Value</th>
<th>Wage</th>
</tr>
</thead>
</table>
<div id="formationButtons">
<button id="442">4-4-2</button>
<button id="352">3-5-2</button>
<button id="532">5-3-2</button>
<button id="451">4-5-1</button>
<button id="541">5-4-1</button>
</div>
</div>
<button id="teamMainBtn" type="button">Main Menu</button>
</section>
<section class="hide" id="league-page">
<table id="leagueTable">
<thead>
<tr>
<th>Position</th>
<th>Team</th>
<th>P</th>
<th>W</th>
<th>D</th>
<th>L</th>
<th>GF</th>
<th>GA</th>
<th>GD</th>
<th>Pts</th>
</tr>
</thead>
</table>
<button id="leagueMainBtn" type="button">Main Menu</button>
</section>
<section class="hide" id="schedule-page">
<div id="fixture_page">
<div id="schedule_container">
</div>
<button id="scheduleMainBtn" type="button">Main Menu</button>
</div>
</section>
<section class="hide" id="history-page">
<div>
<div>
</div>
<button id="historyMainBtn" type="button">Main Menu</button>
</div>
</section>
<section class="hide" id="game-screen">
<h2 id="time">0</h2>
<div id="teamLayer">
<h2 id="homeTeam">Home Team</h2>
<div id="scoreDiv">
<h2 id="homeScore">0</h2>
<h2>:</h2>
<h2 id="awayScore">0</h2>
</div>
<h2 id="awayTeam">Away Team</h2>
</div>
<div id="eventLayer">
<p id="homeScorer"></p>
<p id="awayScorer"></p>
</div>
<div id="buttonBox">
<button id="startGame" type="button">Start Game</button>
<!-- <button type="button" id="nextMainBtn" class="hide">Main Menu</button> -->
<button class="hide" id="nextResultsBtn" type="button">Results</button>
</div>
</section>
<section class="hide" id="results-screen">
<div id="results_container">
<table id="resultsTable">
<thead id="resultsHeader">
</thead>
</table>
<button id="resultsMainBtn" type="button">Main Menu</button>
</div>
</section>
</main>
