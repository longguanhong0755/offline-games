<!DOCTYPE html>

<html lang="en"><head><meta content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' data:; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' data: blob:; frame-src 'self' data: blob:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'" http-equiv="Content-Security-Policy"/><script src="./_offline-bootstrap.js"></script>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tower Defense Game</title>
<link href="/_assets/a442a73bd44cdc0c6466.css" rel="stylesheet"/>
<style>[id^='aswift_'],#google_esf,.adsbygoogle,ins.adsbygoogle,.ad,.ads,.advert,.advertisement,[class*='ad-container'],[class*='ad-slot'],[class*='advert'],[data-ad-client],[data-ad-slot]{display:none!important;visibility:hidden!important}</style></head>
<body>
<div id="game-container">
<div id="slides">
<div class="slide active" id="slide-1">
<h2>Welcome to Tower Defense Game</h2>
<p>Defend your base by placing towers strategically to defeat incoming enemies.</p>
<button onclick="showSlide(2)">Next</button>
</div>
<div class="slide" id="slide-2">
<h2>Select Your Tower</h2>
<div id="controls">
<button onclick="setTowerType('Basic Tower')">Basic Tower</button>
<button onclick="setTowerType('Sniper Tower')">Sniper Tower</button>
<button onclick="setTowerType('Rapid Fire Tower')">Rapid Fire Tower</button>
<button onclick="setTowerType('Splash Damage Tower')">Splash Damage Tower</button>
</div>
<button onclick="showSlide(1)">Back</button>
<button onclick="startGame()">Start Game</button>
</div>
</div>
<div id="game-info">
<div id="scoreboard">
<p>Level: <span id="level">1</span></p>
<p>Score: <span id="score">0</span></p>
<p>Lives: <span id="lives">3</span></p>
</div>
<div class="hidden" id="game-over">
<h2>Game Over</h2>
<button onclick="restartGame()">Restart</button>
</div>
</div>
<canvas height="600" id="gameCanvas" width="800"></canvas>
</div>
<script src="/_assets/af2daa14d408b04d6789.js"></script>
</body></html>
