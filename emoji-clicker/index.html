<meta content="A vibrant clicker RPG. Defeat 10 emoji bosses, manage energy, and upgrade your skills!" name="description"/>
<title>Emoji Clicker RPG</title>
<link href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;🎮&lt;/text&gt;&lt;/svg&gt;" rel="icon"/>

<body>
<div id="app">
<header>
<h1>🎮 Emoji Clicker</h1>
<div class="subtitle">Defeat the 10 emoji bosses and upgrade your skills</div>
</header>
<div class="game-container">
<!-- Stats Panel -->
<div class="card stats-panel">
<div class="stat-item">
<div class="stat-header"><span>❤️ HEALTH</span></div>
<div class="stat-value" id="health-val">100</div>
<div class="progress-bar">
<div class="progress-fill" id="health-bar" style="width: 100%; background-color: var(--health-color);"></div>
</div>
</div>
<div class="stat-item">
<div class="stat-header"><span>⚡ ENERGY</span></div>
<div class="stat-value" id="energy-val">100</div>
<div class="progress-bar">
<div class="progress-fill" id="energy-bar" style="width: 100%; background-color: var(--energy-color);"></div>
</div>
</div>
<div class="stat-item">
<div class="stat-header"><span>💪 STRENGTH</span></div>
<div class="stat-value" id="strength-val">10</div>
</div>
<div class="stat-item">
<div class="stat-header"><span>🔄 RECOVERY</span></div>
<div class="stat-value"><span id="recovery-val">1</span>/s</div>
</div>
</div>
<!-- Boss Arena -->
<div class="card arena-panel">
<div class="level-indicator">LEVEL <span id="level-val">1</span> / 10</div>
<div class="boss-container" id="boss-container">
<div class="boss-emoji" id="boss-emoji">👾</div>
<div class="boss-hp-bar">
<div class="boss-hp-fill" id="boss-hp-bar" style="width: 100%;"></div>
</div>
<div style="color: var(--text-secondary); font-size: 0.9rem;">
<span id="boss-hp-text">100</span> HP
            </div>
</div>
</div>
</div>
<!-- Upgrades -->
<div class="footer-panel">
<div class="currency-display">
          Available Points: <span class="currency-value" id="currency-val">0</span>
</div>
<div class="upgrades-grid" id="upgrades-grid"><button class="upgrade-btn" disabled="" id="btn-strength">
<div class="upgrade-icon">💪</div>
<div class="upgrade-info">
<div class="upgrade-name">Strength</div>
<div class="upgrade-cost">💰 50</div>
<div style="font-size: 0.7rem; color: #aaa;">+5 Damage/Click</div>
</div>
</button><button class="upgrade-btn" disabled="" id="btn-recovery">
<div class="upgrade-icon">🔄</div>
<div class="upgrade-info">
<div class="upgrade-name">Recovery</div>
<div class="upgrade-cost">💰 100</div>
<div style="font-size: 0.7rem; color: #aaa;">+1 Energy/Sec</div>
</div>
</button><button class="upgrade-btn" disabled="" id="btn-maxHealth">
<div class="upgrade-icon">❤️</div>
<div class="upgrade-info">
<div class="upgrade-name">Max Health</div>
<div class="upgrade-cost">💰 150</div>
<div style="font-size: 0.7rem; color: #aaa;">+20 Max HP</div>
</div>
</button><button class="upgrade-btn" disabled="" id="btn-maxEnergy">
<div class="upgrade-icon">⚡</div>
<div class="upgrade-info">
<div class="upgrade-name">Max Energy</div>
<div class="upgrade-cost">💰 120</div>
<div style="font-size: 0.7rem; color: #aaa;">+20 Max Energy</div>
</div>
</button></div>
</div>
</div>

<script src="/_assets/3bcf06996999ab8510e7.js"></script>
