<meta charset="utf-8"/>

<!-- SEO Meta Tags -->
<title>fruit game</title>
<meta content="you've 30s to pick up fruits before they disappear game made by @rakeshid03." name="description"/>
<!-- Styles -->
<link href="/_assets/cc7b428a3f139a82d138.css" rel="stylesheet"/>

<link href="favicon.png" rel="shortcut icon" type="image/jpg"/>

<body>
<!-- Header with live score and time left countdown-->
<header>
<div class="logo">Collect Fruits</div>
<div class="live-update">
<div id="countdown">
<p>⏱</p><span>: 30</span>
</div>
<div id="score">Score: ₹0</div>
</div>
</header>
<!-- Game box, fruits appear here-->
<main id="game">
<!-- Intro Card to start game, plus how to play discription -->
<div class="card" id="introCard">
<h2>WELCOME!</h2>
<p>Pick up fruits before they disappear.</p>
<p>Each fruit has a different price.</p>
<p>You have 30 seconds to collect as many as you can!</p>
<p>Make a high score among other players to win.</p>
<button onclick="startGame()">Play</button>
</div>
</main>
<!-- Settings Button -->
<button id="settingsBtn">⚙️</button>
<!-- Settings Modal -->
<div class="hidden" id="settingsModal">
<div class="modal-content">
<h3>Settings</h3>
<label class="switch" for="vibrationToggle">
<input checked="" id="vibrationToggle" type="checkbox"/>
        Vibration
      </label>
<label class="switch">
<input checked="" id="soundToggle" type="checkbox"/>
        Sound (not added)
      </label>
<label class="switch">
<input id="darkModeToggle" type="checkbox"/>
        Dark Mode
      </label>
<strong>Difficulty:</strong>
<div class="level">
<label class="radio">
<input checked="" name="difficulty" type="radio" value="easy"/>
<span class="name">Easy</span>
</label>
<label class="radio">
<input name="difficulty" type="radio" value="hard"/>
<span class="name">Hard</span>
</label>
</div>
</div>
</div>

<footer class="contact">
