<div class="app">
<h1 class="heading">Welcome to Word Association</h1>
<h2 class="description">Check your vocabulary now!</h2>
<div class="score-area">
<h3>Score: <span id="score-display">0</span></h3>

<option value="3">Level 4</option>

</select>
<div id="controls">
<button disabled="" id="next-level-button">Next Level</button>
<button id="restart-button" style="display: inline-block; margin-left: 10px;">Restart</button>
</div>
</div>
<h1 class="heading-text">Select the correct Word</h1>
<div class="question-area">
<div class="questions" id="question-display"><div class="question-box"><h1 class="logo">✒</h1><p>strong</p><p>powerful</p><p>forceful</p><div class="question-buttons"><button class="question-button">intense</button><button class="question-button">subtle</button></div><div class="answer-display"></div></div><div class="question-box"><h1 class="logo">✒</h1><p>close</p><p>near</p><p>next</p><div class="question-buttons"><button class="question-button">trace</button><button class="question-button">adjacent</button></div><div class="answer-display"></div></div><div class="question-box"><h1 class="logo">✒</h1><p>assume</p><p>insight</p><p>weather</p><div class="question-buttons"><button class="question-button">forecast</button><button class="question-button">sustainable</button></div><div class="answer-display"></div></div><div class="question-box"><h1 class="logo">✒</h1><p>foreign</p><p>national</p><p>ethnic</p><div class="question-buttons"><button class="question-button">mad</button><button class="question-button">exotic</button></div><div class="answer-display"></div></div><div class="question-box"><h1 class="logo">✒</h1><p>break</p><p>divide</p><p>split</p><div class="question-buttons"><button class="question-button">combine</button><button class="question-button">separate</button></div><div class="answer-display"></div></div></div>
</div>
</div>
