<!DOCTYPE html>

<html lang="en"><head><meta content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' data:; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' data: blob:; frame-src 'self' data: blob:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'" http-equiv="Content-Security-Policy"/><script src="./_offline-bootstrap.js"></script>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="A sleek sliding puzzle game built with pure HTML, CSS, and JavaScript. Powered by OpenClaw." name="description"/>
<title>OpenClaw Puzzle Game</title>
<link href="/_assets/f820c0ef5cc8796e26d4.css" rel="stylesheet"/>
<style>[id^='aswift_'],#google_esf,.adsbygoogle,ins.adsbygoogle,.ad,.ads,.advert,.advertisement,[class*='ad-container'],[class*='ad-slot'],[class*='advert'],[data-ad-client],[data-ad-slot]{display:none!important;visibility:hidden!important}</style></head>
<body>
<h1>🧩 OpenClaw Puzzle</h1>
<p class="subtitle">Slide the tiles to solve the puzzle</p>
<div class="controls">
<select id="difficulty">
<option value="3">3×3 Easy</option>
<option selected="" value="4">4×4 Classic</option>
<option value="5">5×5 Hard</option>
</select>
<button onclick="shuffle()">🔀 Shuffle</button>
<button onclick="resetGame()">🔄 Reset</button>
</div>
<div class="stats">
<div><span>Moves:</span> <strong id="moves">0</strong></div>
<div><span>Time:</span> <strong id="timer">0:00</strong></div>
<div><span>Best:</span> <strong id="best">—</strong></div>
</div>
<div class="board-container">
<div class="board" id="board" style="grid-template-columns: repeat(4, 90px); grid-template-rows: repeat(4, 90px);"><div class="tile" style="font-size: 1.4rem;">11</div><div class="tile" style="font-size: 1.4rem;">6</div><div class="tile" style="font-size: 1.4rem;">4</div><div class="tile" style="font-size: 1.4rem;">3</div><div class="tile" style="font-size: 1.4rem;">14</div><div class="tile" style="font-size: 1.4rem;">2</div><div class="tile" style="font-size: 1.4rem;">8</div><div class="tile" style="font-size: 1.4rem;">12</div><div class="tile empty" style="font-size: 1.4rem;"></div><div class="tile" style="font-size: 1.4rem;">1</div><div class="tile" style="font-size: 1.4rem;">13</div><div class="tile" style="font-size: 1.4rem;">15</div><div class="tile" style="font-size: 1.4rem;">7</div><div class="tile" style="font-size: 1.4rem;">9</div><div class="tile" style="font-size: 1.4rem;">10</div><div class="tile" style="font-size: 1.4rem;">5</div></div>
</div>
<div class="win-overlay" id="winOverlay">
<h2>🎉 You Win!</h2>
<p id="winMsg">Solved in 0 moves and 0:00</p>
<button onclick="closeWin()">Play Again</button>
</div>
<script src="/_assets/ebf0f458d469ee304149.js"></script>
</body></html>
