<body>
<div class="container">
<section class="tools-board">
<div class="row">
<label class="title">Shapes</label>
<ul class="options">
<li class="option tool" id="rectangle">
<img alt="" src="/_assets/32ae6c8bbe78d4083743.svg"/>
<span>Rectangle</span>
</li>
<li class="option tool" id="circle">
<img alt="" src="/_assets/4a5ea069f2d89291fb65.svg"/>

</li>
<li class="option tool" id="triangle">
<img alt="" src="/_assets/2103d314b40879af55c7.svg"/>

</li>
<li class="option">
<input id="fill-color" type="checkbox"/>
<label for="fill-color">Fill color</label>
</li>
</ul>
</div>
<div class="row">
<label class="title">Options</label>
<ul class="options">
<li class="option active tool" id="brush">
<img alt="" src="/_assets/f51e4322b1932f833d21.svg"/>
<span>Brush</span>
</li>
<li class="option tool" id="eraser">
<img alt="" src="/_assets/0b951f690ab33a82ea1b.svg"/>
<span>Eraser</span>
</li>
<li class="option">
<input id="size-slider" max="30" min="1" type="range" value="5"/>
</li>
</ul>
</div>
<div class="row colors">
<label class="title">Colors</label>
<ul class="options">
<li class="option"></li>
<li class="option selected"></li>
<li class="option"></li>
<li class="option"></li>
<li class="option">
<input id="color-picker" type="color" value="#4A98F7"/>
</li>
</ul>
</div>
<div class="row buttons">
<button class="clear-canvas">Clear Canvas</button>
<button class="save-img">Save As Image</button>
</div>
</section>
<section class="drawing-board">
<canvas height="564" width="810"></canvas>
</section>
